<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Management System | Medicaps University</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap');:root{--navy:#172554;--blue:#3b4da3;--red:#9d2344;--ink:#20283b;--muted:#788398;--line:#e8ebf2;--bg:#f5f7fb;--teal:#148b85;--shadow:0 8px 28px rgba(23,37,84,.055)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}.shell{min-height:100vh;display:flex}.sidebar{width:248px;background:#fff;border-right:1px solid var(--line);position:fixed;inset:0 auto 0 0;padding:24px 17px;display:flex;flex-direction:column;z-index:5}.brand{display:flex;align-items:center;gap:11px;padding:0 8px 32px}.mark{width:40px;height:40px;border-radius:11px;background:linear-gradient(140deg,#26357c,#9e2145);display:grid;place-items:center;color:#fff;font:800 21px Manrope}.brand b{display:block;color:var(--navy);font:800 13px Manrope;letter-spacing:1px}.brand small{font-size:9px;letter-spacing:1.5px;color:#929bad}.section-label{font-size:9px;letter-spacing:1.7px;color:#a2aabc;font-weight:800;padding:0 12px 12px}.nav{display:grid;gap:5px}.nav button{background:transparent;text-align:left;padding:12px 13px;border-radius:9px;color:#69758b;font-size:12px;font-weight:600;display:flex;gap:12px;align-items:center}.nav button span:first-child{width:18px;text-align:center;font-size:16px}.nav button:hover,.nav button.active{background:#eef1fc;color:var(--blue)}.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding:16px 4px 0;display:flex;align-items:center;gap:9px}.avatar{width:34px;height:34px;border-radius:50%;background:#e9ecfb;color:var(--blue);display:grid;place-items:center;font-weight:800}.side-bottom b{display:block;font-size:11px}.side-bottom small{font-size:9px;color:var(--muted)}.main{margin-left:248px;width:calc(100% - 248px);min-height:100vh;display:flex;flex-direction:column}.topbar{height:86px;background:#fff;border-bottom:1px solid var(--line);padding:0 38px;display:flex;align-items:center;justify-content:space-between}.eyebrow{font-size:9px;font-weight:800;letter-spacing:1.8px;color:#818ba5}.topbar h1{font:800 21px Manrope;margin:5px 0 0}.topright{display:flex;align-items:center;gap:10px;color:#667085;font-size:12px}.online{width:7px;height:7px;border-radius:50%;background:#25ad7c}.content{padding:29px 38px;max-width:1500px;width:100%;margin:0 auto;flex:1}.welcome{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.welcome h2{font:700 20px Manrope;margin:0}.welcome p{font-size:12px;color:var(--muted);margin:6px 0 0}.primary{background:var(--blue);color:#fff;padding:11px 16px;border-radius:8px;font-weight:700;font-size:11px;box-shadow:0 5px 14px #3549a21c}.primary:hover{background:#293b8e}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:19px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}.stat{padding:17px}.stat-head{display:flex;justify-content:space-between;color:#8993a5;font-size:11px}.stat-icon{width:31px;height:31px;border-radius:9px;background:#eef1fc;color:var(--blue);display:grid;place-items:center;font-size:15px}.stat strong{display:block;font:800 25px Manrope;margin:13px 0 3px}.stat small{font-size:10px;color:#98a1af}.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:15px}.panel{padding:19px;margin-bottom:15px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.panel-head h3{font:700 14px Manrope;margin:0}.panel-head small{font-size:10px;color:var(--muted)}.quick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.quick{border:1px solid var(--line);border-radius:10px;padding:14px;background:#fff;text-align:left;color:var(--ink)}.quick:hover{border-color:#aab4e3;background:#fafbff}.quick b{font-size:12px;display:block;margin:7px 0 3px}.quick small{font-size:10px;color:var(--muted)}.toolbar{display:flex;gap:9px;align-items:center;margin-bottom:14px;flex-wrap:wrap}.toolbar input,.field input,.field select{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff;outline:none;color:var(--ink)}.toolbar input{min-width:240px}.toolbar .primary{margin-left:auto}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;font-size:9px;letter-spacing:.7px;color:#929bad;text-transform:uppercase;padding:11px 12px;border-bottom:1px solid var(--line)}td{padding:12px;border-bottom:1px solid #f0f1f5;font-size:11px;color:#596478}tr:last-child td{border:0}.pill{border-radius:20px;padding:5px 9px;font-size:9px;font-weight:700;background:#edf8f3;color:#16815f}.pill.pending{background:#fff2e8;color:#bd6b23}.pill.absent{background:#fff0f2;color:#bf4056}.actions{display:flex;gap:6px}.mini{padding:6px 9px;border-radius:6px;background:#f0f2fa;color:var(--blue);font-size:10px}.mini.danger{background:#fff0f2;color:#c13e55}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.field{display:flex;flex-direction:column;gap:7px;font-size:11px;font-weight:700;color:#596478}.field input,.field select{width:100%;font-weight:400}.wide{grid-column:1/-1}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}.secondary{background:#f0f2f7;color:#667085;padding:11px 15px;border-radius:8px;font-weight:700;font-size:11px}.bar{height:8px;border-radius:8px;background:#eef0f5;overflow:hidden}.bar i{display:block;height:100%;background:var(--teal);border-radius:8px}.empty{text-align:center;color:#98a1af;padding:25px;font-size:12px}.toast{position:fixed;right:24px;bottom:24px;background:#172554;color:#fff;padding:12px 17px;border-radius:9px;font-size:12px;opacity:0;transform:translateY(8px);transition:.2s;z-index:10}.toast.show{opacity:1;transform:none}footer{padding:14px 38px;background:#fff;border-top:1px solid var(--line);font-size:10px;color:#9aa2b1}@media(max-width:950px){.sidebar{width:205px}.main{margin-left:205px;width:calc(100% - 205px)}.stats{grid-template-columns:repeat(2,1fr)}.content{padding:23px}.topbar{padding:0 23px}}@media(max-width:650px){.sidebar{width:62px;padding:15px 7px}.brand{padding:0 4px 25px}.brand>div:last-child,.section-label,.nav .txt,.side-bottom>div:not(.avatar){display:none}.nav button{justify-content:center;padding:12px 5px}.main{margin-left:62px;width:calc(100% - 62px)}.content{padding:17px}.topbar{padding:0 17px;height:72px}.grid2{grid-template-columns:1fr}.stats{gap:9px}.stat{padding:13px}.stat strong{font-size:21px}.welcome{align-items:flex-start;gap:12px;flex-direction:column}.toolbar input{min-width:100%;width:100%}.form-grid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body><div class="shell"><aside class="sidebar"><div class="brand"><div class="mark">M</div><div><b>MEDICAPS</b><small>STUDENT PORTAL</small></div></div><div class="section-label">WORKSPACE</div><nav class="nav"><button class="active" data-page="dashboard"><span>▦</span><span class="txt">Overview</span></button><button data-page="students"><span>♙</span><span class="txt">Students</span></button><button data-page="teachers"><span>♧</span><span class="txt">Teachers</span></button><button data-page="attendance"><span>◷</span><span class="txt">Attendance</span></button><button data-page="marks"><span>✎</span><span class="txt">Marks & Grades</span></button><button data-page="fees"><span>₹</span><span class="txt">Fees</span></button><button data-page="reports"><span>▥</span><span class="txt">Reports</span></button></nav><div class="side-bottom"><div class="avatar">A</div><div><b>Administrator</b><small>ADMINISTRATOR</small></div></div></aside><main class="main"><header class="topbar"><div><div class="eyebrow">MEDICAPS UNIVERSITY · STUDENT INFORMATION SYSTEM</div><h1 id="pageTitle">Overview</h1></div><div class="topright"><i class="online"></i><span>Interactive preview</span><div class="avatar">A</div></div></header><section class="content" id="content"></section><footer>© 2026 Medicaps University · Student Management System <span style="float:right">Preview uses sample data only</span></footer></main></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);let page='dashboard';let students=[{id:'STU001',name:'Aarav Sharma',course:'B.Tech CSE',dept:'Computer Science',sem:6,email:'aarav.sharma@medicaps.ac.in'},{id:'STU002',name:'Ananya Patel',course:'B.Tech CSE',dept:'Computer Science',sem:6,email:'ananya.patel@medicaps.ac.in'},{id:'STU003',name:'Rohan Verma',course:'B.Tech IT',dept:'Information Technology',sem:4,email:'rohan.verma@medicaps.ac.in'},{id:'STU004',name:'Isha Gupta',course:'BBA',dept:'Management',sem:2,email:'isha.gupta@medicaps.ac.in'},{id:'STU005',name:'Kabir Singh',course:'B.Tech CSE',dept:'Computer Science',sem:6,email:'kabir.singh@medicaps.ac.in'}];let teachers=[{id:'TCH001',name:'Dr. Neha Joshi',dept:'Computer Science',email:'neha.joshi@medicaps.ac.in',courses:'Data Structures, DBMS'},{id:'TCH002',name:'Prof. Rahul Mehta',dept:'Information Technology',email:'rahul.mehta@medicaps.ac.in',courses:'Computer Networks'}];let attendance=[{id:'STU001',name:'Aarav Sharma',date:'2026-11-24',course:'B.Tech CSE',status:'PRESENT'},{id:'STU002',name:'Ananya Patel',date:'2026-11-24',course:'B.Tech CSE',status:'PRESENT'},{id:'STU003',name:'Rohan Verma',date:'2026-11-24',course:'B.Tech IT',status:'ABSENT'},{id:'STU004',name:'Isha Gupta',date:'2026-11-24',course:'BBA',status:'PRESENT'}];let marks=[{id:'STU001',name:'Aarav Sharma',subject:'Database Management',obtained:88,max:100,grade:'A'},{id:'STU002',name:'Ananya Patel',subject:'Computer Networks',obtained:94,max:100,grade:'A+'},{id:'STU003',name:'Rohan Verma',subject:'Java Programming',obtained:76,max:100,grade:'B'}];let fees=[{id:'STU001',name:'Aarav Sharma',total:125000,paid:100000},{id:'STU002',name:'Ananya Patel',total:125000,paid:125000},{id:'STU003',name:'Rohan Verma',total:118000,paid:80000},{id:'STU004',name:'Isha Gupta',total:95000,paid:70000}];const money=n=>'₹'+Number(n).toLocaleString('en-IN');function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2200)}function stats(a){return `<div class="stats">${a.map(([l,v,i,s])=>`<article class="stat"><div class="stat-head"><span>${l}</span><span class="stat-icon">${i}</span></div><strong>${v}</strong><small>${s||'Updated from sample records'}</small></article>`).join('')}</div>`}function panel(t,b){return `<section class="panel"><div class="panel-head"><h3>${t}</h3><small>STUDENT MANAGEMENT SYSTEM</small></div>${b}</section>`}function table(h,rows){return `<div class="table-wrap"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${h.length}" class="empty">No records found</td></tr>`}</tbody></table></div>`}function nav(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#pageTitle').textContent=({dashboard:'Overview',students:'Student Records',teachers:'Teachers',attendance:'Attendance Management',marks:'Marks & Grades',fees:'Fee Management',reports:'Reports & Analytics'})[p];render()}function render(){let c='';if(page==='dashboard'){let paid=fees.reduce((a,x)=>a+x.paid,0),total=fees.reduce((a,x)=>a+x.total,0),pr=attendance.filter(x=>x.status==='PRESENT').length;c=`<div class="welcome"><div><h2>Welcome back, Administrator 👋</h2><p>Here is what's happening with your academic workspace today.</p></div><button class="primary" onclick="studentForm()">＋ Add student</button></div>${stats([['Total students',students.length,'♙','Registered student records'],['Total teachers',teachers.length,'♧','Teaching faculty'],['Attendance today',Math.round(pr/attendance.length*100)+'%','◷','Present / marked today'],['Fees collected',money(paid),'₹','Across '+fees.length+' fee records']])}<div class="grid2">${panel('Quick actions',`<div class="quick-grid"><button class="quick" onclick="studentForm()">＋<b>Add a student</b><small>Create a new student record</small></button><button class="quick" onclick="nav('attendance')">◷<b>Attendance</b><small>Review daily attendance</small></button><button class="quick" onclick="nav('marks')">✎<b>Enter marks</b><small>Update academic results</small></button><button class="quick" onclick="nav('fees')">₹<b>Manage fees</b><small>Track fee balances</small></button></div>`)}${panel('Fee collection overview',`<div style="font:800 27px Manrope;margin:8px 0">${money(paid)}</div><p style="font-size:11px;color:#788398">${Math.round(paid/total*100)}% collected of ${money(total)}</p><div class="bar"><i style="width:${paid/total*100}%"></i></div>`)}</div>${panel('Recently registered students',table(['Student ID','Student name','Course','Semester','Status'],students.slice(0,4).map(s=>`<tr><td><b>${s.id}</b></td><td>${s.name}</td><td>${s.course}</td><td>${s.sem}</td><td><span class="pill">Active</span></td></tr>`).join('')))}`};if(page==='students')c=studentsPage();if(page==='teachers')c=panel('Faculty directory',`<div class="toolbar"><span style="font-size:11px;color:#788398">Faculty members and assigned subjects</span><button class="primary" onclick="teacherForm()">＋ Add teacher</button></div>${table(['Teacher ID','Name','Department','Email','Courses'],teachers.map(t=>`<tr><td>${t.id}</td><td>${t.name}</td><td>${t.dept}</td><td>${t.email}</td><td>${t.courses}</td></tr>`).join(''))}`);if(page==='attendance')c=panel('Daily attendance',`<div class="toolbar"><span style="font-size:11px;color:#788398">Attendance records by student and date</span><button class="primary" onclick="attendanceForm()">＋ Mark attendance</button></div>${table(['Student ID','Student','Date','Course','Status'],attendance.map(a=>`<tr><td>${a.id}</td><td>${a.name}</td><td>${a.date}</td><td>${a.course}</td><td><span class="pill ${a.status==='ABSENT'?'absent':''}">${a.status}</span></td></tr>`).join(''))}`);if(page==='marks')c=panel('Academic results',`<div class="toolbar"><span style="font-size:11px;color:#788398">Marks and calculated grades</span><button class="primary" onclick="markForm()">＋ Enter marks</button></div>${table(['Student ID','Student','Subject','Obtained','Maximum','Grade'],marks.map(m=>`<tr><td>${m.id}</td><td>${m.name}</td><td>${m.subject}</td><td>${m.obtained}</td><td>${m.max}</td><td><span class="pill">${m.grade}</span></td></tr>`).join(''))}`);if(page==='fees')c=panel('Fee records',`<div class="toolbar"><span style="font-size:11px;color:#788398">Total, paid and pending fee amounts</span><button class="primary" onclick="feeForm()">＋ Add / update fee</button></div>${table(['Student ID','Student','Total fees','Paid fees','Pending fees'],fees.map(f=>`<tr><td>${f.id}</td><td>${f.name}</td><td>${money(f.total)}</td><td>${money(f.paid)}</td><td><span class="pill ${f.total-f.paid>0?'pending':''}">${money(f.total-f.paid)}</span></td></tr>`).join(''))}`);if(page==='reports'){let total=fees.reduce((a,x)=>a+x.total,0),paid=fees.reduce((a,x)=>a+x.paid,0),pr=attendance.filter(x=>x.status==='PRESENT').length;c=stats([['Students',students.length,'♙'],['Teachers',teachers.length,'♧'],['Attendance rate',Math.round(pr/attendance.length*100)+'%','◷'],['Pending fees',money(total-paid),'₹']])+panel('Attendance summary',`<p style="font-size:12px">Present records: <b>${pr} / ${attendance.length}</b></p><div class="bar"><i style="width:${pr/attendance.length*100}%"></i></div><p style="font-size:11px;color:#788398">This preview uses sample records. The running Spring Boot application loads data from MySQL.</p><button class="primary" onclick="window.print()">Print / Save report as PDF</button>`)}$('#content').innerHTML=c}function studentsPage(){return panel('Student directory',`<div class="toolbar"><input id="search" placeholder="Search by Student ID or name..." oninput="filterStudents(this.value)"><button class="primary" onclick="studentForm()">＋ Add student</button></div><div id="studentTable">${studentRows(students)}</div>`)}function studentRows(a){return table(['Student ID','Full name','Course','Department','Semester','Email','Actions'],a.map(s=>`<tr><td><b>${s.id}</b></td><td>${s.name}</td><td>${s.course}</td><td>${s.dept}</td><td>${s.sem}</td><td>${s.email}</td><td><button class="mini" onclick="editStudent('${s.id}')">Edit</button> <button class="mini danger" onclick="deleteStudent('${s.id}')">Delete</button></td></tr>`).join(''))}function filterStudents(q){$('#studentTable').innerHTML=studentRows(students.filter(s=>(s.id+' '+s.name).toLowerCase().includes(q.toLowerCase())))}function studentForm(id=''){let s=students.find(x=>x.id===id)||{};$('#content').innerHTML=panel(id?'Update student':'Add student',`<form id="sf" class="form-grid"><label class="field">Student ID<input name="id" required value="${s.id||''}" ${id?'readonly':''}></label><label class="field">Full name<input name="name" required value="${s.name||''}"></label><label class="field">Email<input name="email" type="email" value="${s.email||''}"></label><label class="field">Department<input name="dept" required value="${s.dept||''}"></label><label class="field">Course<input name="course" required value="${s.course||''}"></label><label class="field">Semester<input name="sem" type="number" min="1" max="12" required value="${s.sem||''}"></label><div class="form-actions wide"><button type="button" class="secondary" onclick="nav('students')">Cancel</button><button class="primary">Save student</button></div></form>`);$('#sf').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));if(!id&&students.some(x=>x.id===d.id)){toast('Student ID already exists');return}d.sem=Number(d.sem);if(id)students=students.map(x=>x.id===id?d:x);else students.push(d);toast('Student record saved in preview');nav('students')}}function editStudent(id){studentForm(id)}function deleteStudent(id){if(confirm('Delete student '+id+'?')){students=students.filter(s=>s.id!==id);toast('Student deleted from preview');render()}}function teacherForm(){$('#content').innerHTML=panel('Add teacher',`<form id="tf" class="form-grid"><label class="field">Teacher ID<input name="id" required></label><label class="field">Full name<input name="name" required></label><label class="field">Department<input name="dept" required></label><label class="field">Email<input name="email" type="email"></label><label class="field wide">Assigned courses<input name="courses"></label><div class="form-actions wide"><button type="button" class="secondary" onclick="nav('teachers')">Cancel</button><button class="primary">Save teacher</button></div></form>`);$('#tf').onsubmit=e=>{e.preventDefault();teachers.push(Object.fromEntries(new FormData(e.target)));toast('Teacher added in preview');nav('teachers')}}function attendanceForm(){$('#content').innerHTML=panel('Mark daily attendance',`<form id="af" class="form-grid"><label class="field">Course / Class<select name="course"><option>B.Tech CSE</option><option>B.Tech IT</option><option>BBA</option></select></label><label class="field">Date<input type="date" name="date" value="2026-11-24" required></label><div class="wide">${table(['Student ID','Student','Attendance'],students.map(s=>`<tr><td>${s.id}</td><td>${s.name}</td><td><select name="${s.id}"><option value="PRESENT">Present</option><option value="ABSENT">Absent</option></select></td></tr>`).join(''))}</div><div class="form-actions wide"><button type="button" class="secondary" onclick="nav('attendance')">Cancel</button><button class="primary">Save attendance</button></div></form>`);$('#af').onsubmit=e=>{e.preventDefault();let d=new FormData(e.target);students.forEach(s=>attendance.push({id:s.id,name:s.name,date:d.get('date'),course:d.get('course'),status:d.get(s.id)}));toast('Attendance saved in preview');nav('attendance')}}function markForm(){$('#content').innerHTML=panel('Enter student marks',`<form id="mf" class="form-grid"><label class="field">Student<select name="id">${students.map(s=>`<option value="${s.id}">${s.id} – ${s.name}</option>`).join('')}</select></label><label class="field">Subject<input name="subject" required></label><label class="field">Obtained marks<input name="obtained" type="number" min="0" required></label><label class="field">Maximum marks<input name="max" type="number" min="1" value="100" required></label><div class="form-actions wide"><button type="button" class="secondary" onclick="nav('marks')">Cancel</button><button class="primary">Save marks</button></div></form>`);$('#mf').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),o=Number(d.obtained),m=Number(d.max);if(o<0||o>m){toast('Marks must be between 0 and maximum');return}let p=o/m*100,g=p>=90?'A+':p>=80?'A':p>=70?'B':p>=60?'C':p>=50?'D':'F';marks.push({id:d.id,name:students.find(s=>s.id===d.id).name,subject:d.subject,obtained:o,max:m,grade:g});toast('Marks saved and grade calculated');nav('marks')}}function feeForm(){$('#content').innerHTML=panel('Add / update fee record',`<form id="ff" class="form-grid"><label class="field">Student<select name="id">${students.map(s=>`<option value="${s.id}">${s.id} – ${s.name}</option>`).join('')}</select></label><label class="field">Total fees (₹)<input name="total" type="number" min="0" required></label><label class="field">Paid fees (₹)<input name="paid" type="number" min="0" required></label><div class="form-actions wide"><button type="button" class="secondary" onclick="nav('fees')">Cancel</button><button class="primary">Save fee record</button></div></form>`);$('#ff').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),t=Number(d.total),p=Number(d.paid);if(p>t){toast('Paid fees cannot exceed total fees');return}let old=fees.find(f=>f.id===d.id);if(old){old.total=t;old.paid=p}else fees.push({id:d.id,name:students.find(s=>s.id===d.id).name,total:t,paid:p});toast('Fee record saved in preview');nav('fees')}}document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.page)));render();
</script></body></html>
